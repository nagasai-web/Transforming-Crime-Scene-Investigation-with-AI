<!DOCTYPE html>
<html>
<head>
    <title>Admin Home Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .admin-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .admin-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .admin-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .admin-card h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .admin-card p {
            color: #666;
            font-size: 14px;
        }

        .logout-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>👨‍💼 Welcome Admin!</h1>
            <p>Crime Detection System Administration Panel</p>
        </div>

        <div class="admin-grid">
            <a href="{% url 'admin_dashboard' %}" class="admin-card">
                <div class="admin-icon">👥</div>
                <h2>User Management</h2>
                <p>View, activate, and manage registered users</p>
            </a>

            <a href="{% url 'gemini_config' %}" class="admin-card">
                <div class="admin-icon">🤖</div>
                <h2>Gemini AI Configuration</h2>
                <p>Configure Google Gemini API for AI-powered reports</p>
            </a>

            <a href="{% url 'view_reports' %}" class="admin-card">
                <div class="admin-icon">📊</div>
                <h2>View Reports</h2>
                <p>Access all generated video analysis reports</p>
            </a>
        </div>

        <div style="text-align: center;">
            <a href="{% url 'user_logout' %}" class="logout-btn">🚪 Logout</a>
        </div>
    </div>
</body>
</html>
