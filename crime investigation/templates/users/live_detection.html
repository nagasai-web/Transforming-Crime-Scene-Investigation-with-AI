{% extends 'users/user_base.html' %}
{% block content %}

<!DOCTYPE html>
<html>
<head>
    <title>Live Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .live-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #00cc66;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvas {
            display: none;
        }

        .overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .overlay-info p {
            margin: 5px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #00cc66, #00aa55);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
        }

        .btn-capture {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box h3 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .stat-box p {
            color: #666;
            font-size: 14px;
        }

        .alert-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-box.danger {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .alert-box h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .detections-log {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            border-left: 3px solid #667eea;
        }

        .log-item.weapon {
            border-left-color: #ff4444;
        }

        .log-item .timestamp {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="live-container">
        <div class="header">
            <h1>📹 Live Crime Detection</h1>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Inactive</span>
            </div>
        </div>

        <div class="video-section">
            <div class="video-wrapper">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div class="overlay-info" id="overlayInfo">
                    <p><strong>FPS:</strong> <span id="fps">0</span></p>
                    <p><strong>Objects:</strong> <span id="objectCount">0</span></p>
                    <p><strong>Risk:</strong> <span id="riskLevel">NORMAL</span></p>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startDetection()">
                    🚀 Start Detection
                </button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopDetection()" disabled>
                    ⏹️ Stop Detection
                </button>
                <button class="btn btn-capture" id="captureBtn" onclick="captureFrame()" disabled>
                    📸 Capture Frame
                </button>
                <button class="btn btn-capture" onclick="window.location.href='{% url 'user_homepage' %}'">
                    🏠 Back to Dashboard
                </button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-box">
                    <h3 id="totalDetections">0</h3>
                    <p>Total Detections</p>
                </div>
                <div class="stat-box">
                    <h3 id="personCount">0</h3>
                    <p>Persons</p>
                </div>
                <div class="stat-box">
                    <h3 id="weaponCount">0</h3>
                    <p>Weapons</p>
                </div>
                <div class="stat-box">
                    <h3 id="frameCount">0</h3>
                    <p>Frames Processed</p>
                </div>
            </div>

            <!-- Alerts -->
            <div id="alertContainer"></div>

            <!-- Detection Log -->
            <h3 style="margin-bottom: 15px; color: #333;">Detection Log:</h3>
            <div class="detections-log" id="detectionLog">
                <p style="text-align: center; color: #999;">No detections yet. Start the camera to begin.</p>
            </div>
        </div>
    </div>

    <script>
        let video = document.getElementById('videoElement');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let stream = null;
        let detectionInterval = null;
        let frameCounter = 0;
        let totalDetections = 0;
        let personDetections = 0;
        let weaponDetections = 0;

        async function startDetection() {
            try {
                // Request camera access
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 }
                });
                video.srcObject = stream;

                // Update UI
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').textContent = 'Active';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('captureBtn').disabled = false;

                // Start detection loop
                detectionInterval = setInterval(processFrame, 1000); // Process every second

                addLog('System started', 'info');
            } catch (error) {
                alert('Error accessing camera: ' + error.message);
                console.error(error);
            }
        }

        function stopDetection() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            if (detectionInterval) {
                clearInterval(detectionInterval);
            }

            // Update UI
            document.getElementById('statusDot').classList.remove('active');
            document.getElementById('statusText').textContent = 'Inactive';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('captureBtn').disabled = true;

            addLog('System stopped', 'info');
        }

        function processFrame() {
            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw current frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Simulate detection (in real implementation, send frame to backend)
            simulateDetection();

            // Update frame counter
            frameCounter++;
            document.getElementById('frameCount').textContent = frameCounter;
            document.getElementById('fps').textContent = '30';
        }

        function simulateDetection() {
            // Simulate random detections for demo
            const random = Math.random();

            if (random > 0.7) {
                const detectionType = Math.random() > 0.5 ? 'person' : 'weapon';

                if (detectionType === 'person') {
                    personDetections++;
                    document.getElementById('personCount').textContent = personDetections;
                    addLog('Person detected', 'person');
                } else {
                    weaponDetections++;
                    document.getElementById('weaponCount').textContent = weaponDetections;
                    addLog('⚠️ Weapon detected!', 'weapon');
                    showAlert('Weapon detected in frame!', 'danger');
                }

                totalDetections++;
                document.getElementById('totalDetections').textContent = totalDetections;
                document.getElementById('objectCount').textContent = totalDetections;

                // Update risk level
                if (personDetections > 0 && weaponDetections > 0) {
                    document.getElementById('riskLevel').textContent = 'HIGH RISK';
                    document.getElementById('riskLevel').style.color = '#ff4444';
                } else if (weaponDetections > 0) {
                    document.getElementById('riskLevel').textContent = 'MEDIUM RISK';
                    document.getElementById('riskLevel').style.color = '#ffaa00';
                }
            }
        }

        function captureFrame() {
            // Capture current frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'capture_' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                addLog('Frame captured', 'info');
            });
        }

        function addLog(message, type) {
            const logContainer = document.getElementById('detectionLog');

            // Remove placeholder
            if (logContainer.children.length === 1 && logContainer.children[0].tagName === 'P') {
                logContainer.innerHTML = '';
            }

            const logItem = document.createElement('div');
            logItem.className = 'log-item' + (type === 'weapon' ? ' weapon' : '');

            const timestamp = new Date().toLocaleTimeString();
            logItem.innerHTML = `
                <strong>${message}</strong>
                <div class="timestamp">${timestamp}</div>
            `;

            logContainer.insertBefore(logItem, logContainer.firstChild);

            // Keep only last 20 logs
            while (logContainer.children.length > 20) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');

            const alert = document.createElement('div');
            alert.className = 'alert-box' + (type === 'danger' ? ' danger' : '');
            alert.innerHTML = `<h4>⚠️ Alert</h4><p>${message}</p>`;

            alertContainer.appendChild(alert);

            // Auto remove after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>

{% endblock %}
